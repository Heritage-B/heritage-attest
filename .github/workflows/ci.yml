name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std --no-commit
      - name: Test contracts
        working-directory: contracts
        run: forge test -vvv

  attestor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build --workspace @heritageb/attestor
      - run: npm test --workspace @heritageb/attestor
