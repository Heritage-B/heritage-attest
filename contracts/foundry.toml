[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Pinned EVM target. The live peaq mainnet contracts were compiled for `london` (checked: the
# runtime bytecode on peaq matches only a london build), so pinning it keeps every chain on the
# exact same bytecode and makes `forge verify-contract` reproduce it. Robinhood Chain (Arbitrum
# Nitro) supports newer opcodes too; london is a strict subset, so one artifact runs everywhere.
evm_version = "london"

[rpc_endpoints]
peaq_agung = "${PEAQ_AGUNG_RPC}"
peaq = "${PEAQ_RPC}"
# Robinhood Chain (Arbitrum Orbit L2, ETH gas) — docs/DEPLOY_ROBINHOOD.md.
#   testnet (chainId 46630): https://rpc.testnet.chain.robinhood.com
#   mainnet (chainId 4663):  https://rpc.mainnet.chain.robinhood.com
# Public RPCs are rate-limited; a provider URL (Alchemy/QuickNode) also works here.
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
robinhood = "${ROBINHOOD_RPC}"
